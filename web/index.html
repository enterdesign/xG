<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xG Paper Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea;--surface:#fbfaf6;--ink:#1b1a17;--mute:#6b675d;--line:#e0dbcf;--line2:#cfc8b8;
  --accent:#0f5c4d;--accent-ink:#fff;--pos:#0f7a4f;--neg:#b4382c;--warn:#a8741a;
  --serif:"Fraunces",Georgia,serif;--sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --nav:56px
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12130f;--surface:#1a1c17;--ink:#ece9df;--mute:#9a968a;--line:#2a2c25;--line2:#3a3d34;
  --accent:#4fc3a1;--accent-ink:#0c1a15;--pos:#5fd39a;--neg:#ee7d70;--warn:#e0b050}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav) + 18px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
nav{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--nav);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1700px;margin:0 auto;height:100%;padding:0 24px;display:flex;align-items:center;gap:28px}
.brand{font:600 19px var(--serif);letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand span{color:var(--accent)}
.links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.links::-webkit-scrollbar{display:none}
.links a{color:var(--mute);text-decoration:none;font-size:14px;font-weight:500;padding:7px 12px;border-radius:8px;white-space:nowrap;transition:.15s}
.links a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.links a.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.up{color:var(--mute);text-decoration:none;font-size:13px;border:1px solid var(--line2);padding:6px 12px;border-radius:8px;white-space:nowrap}
.up:hover{color:var(--ink);border-color:var(--ink)}
main{max-width:1700px;margin:0 auto;padding:calc(var(--nav) + 40px) 24px 80px}
.hero h1{font:500 clamp(34px,5vw,56px)/1.05 var(--serif);letter-spacing:-.025em;margin:0 0 12px}
.hero p{max-width:720px;color:var(--mute);font-size:16px;margin:0}
.stamp{display:inline-block;font:400 12px var(--mono);color:var(--mute);margin-top:16px}
section{margin-top:56px}
h2{font:500 26px/1.2 var(--serif);letter-spacing:-.015em;margin:0 0 6px}
.lede{color:var(--mute);font-size:14px;margin:0 0 18px;max-width:820px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.k{font:500 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.v{font:500 34px/1.1 var(--serif);letter-spacing:-.02em;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.n{font-size:13px;color:var(--mute)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-size:14px}
.box ul{margin:0;padding-left:18px}.box li{margin:6px 0}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font:500 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--mute);background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
td.num,th.num{text-align:right;font:400 13.5px var(--mono);font-variant-numeric:tabular-nums}
th.num{font:500 11px var(--sans);letter-spacing:.07em}
tbody tr:hover td{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.muted{color:var(--mute)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--mute) 14%,transparent);color:var(--mute)}
.pill.ok{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.pill.bad{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}
.empty{padding:34px;text-align:center;color:var(--mute);border:1px dashed var(--line2);border-radius:14px}
svg text{fill:var(--mute);font:11px var(--mono)}.axis{stroke:var(--line)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
code{font:13px var(--mono);background:color-mix(in srgb,var(--ink) 7%,transparent);padding:1px 6px;border-radius:5px}
.note{font-size:13px;color:var(--mute);margin:12px 0 0;max-width:820px}
section:last-of-type{min-height:calc(100vh - var(--nav) - 80px)}
.scroll.tall{max-height:560px;overflow:auto}
footer{margin-top:72px;padding-top:20px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
@media (max-width:720px){.nav-in{padding:0 12px;gap:10px}.up{display:none}main{padding-left:14px;padding-right:14px}.brand{font-size:16px}}
</style>
</head>
<body>
<nav><div class="nav-in">
  <a class="brand" href="#top">xG<span>.</span>desk</a>
  <div class="links" id="links"></div>
  <a class="up" href="#top">↑ Top</a>
</div></nav>
<main id="top">
  <header class="hero">
    <h1>Paper-trading desk</h1>
    <p>A virtual €1,000 bankroll that hunts for price discrepancies between bookmakers and the sharp Pinnacle line. It does not predict results, and no real money is ever staked.</p>
    <span class="stamp" id="meta"></span>
  </header>
  <div id="view"></div>
  <footer>Virtual money only. Not betting advice. Times are shown in your browser's timezone.</footer>
</main>
<script src="paper.js" onerror="void 0"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pct=x=>x==null?'–':(x*100).toFixed(0)+'%';
const sgn=v=>(v>=0?'+':'')+(v*100).toFixed(1)+'%';
const E=v=>(v<0?'−':'')+'€'+Math.abs(v).toLocaleString('en-IE',{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=v=>(v>=0?'+':'−')+'€'+Math.abs(v).toLocaleString('en-IE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=s=>{const d=new Date(s);return d.toLocaleDateString('en-IE',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'})};
const grp=s=>String(s).startsWith('soccer_')?'Football':String(s).startsWith('basketball_')?'Basketball':String(s).startsWith('icehockey_')?'Ice hockey':String(s).startsWith('tennis_')?'Tennis':'Other';
const GROUPS=['Football','Basketball','Ice hockey','Tennis'];

function lineChart(rows,fmt){
  const W=1000,H=260,L=70,R=12,T=12,B=28;
  const vals=rows.map(r=>r.v);const pad=(Math.max(...vals)-Math.min(...vals))*.06||1;
  const lo=Math.min(...vals,0)-pad,hi=Math.max(...vals,0)+pad;
  const x=i=>L+(W-L-R)*i/Math.max(rows.length-1,1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line2)" stroke-dasharray="4 4"/>`;
  const step=Math.ceil(rows.length/8);
  rows.forEach((r,i)=>{if(i%step==0)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${r.t}</text>`});
  const pts=rows.map((r,i)=>x(i)+','+y(r.v)).join(' ');
  g+=`<polygon points="${L},${y(0)} ${pts} ${x(rows.length-1)},${y(0)}" fill="var(--accent)" opacity=".10"/><polyline fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" points="${pts}"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumulative profit">${g}</svg></div>`;
}
const stat=arr=>{const d=arr.filter(b=>b.status!='void');let turn=0,pnl=0,exp=0,v=0,hit=0;
  d.forEach(b=>{turn+=b.stake;pnl+=b.pnl;exp+=b.stake*b.edge;const p=(1+b.edge)/b.odds;v+=b.stake**2*(p*(b.odds-1)**2+(1-p)-b.edge**2);if(b.status=='won')hit++});
  const sd=Math.sqrt(v);return{n:d.length,turn,pnl,exp,sd,z:sd?(pnl-exp)/sd:null,hit:d.length?hit/d.length:null,roi:turn?pnl/turn:null}};

function build(){
  const P=window.XG_PAPER;
  if(!P){$('#view').innerHTML='<section><div class="empty">The simulator has not run yet. Bets will appear here after the first automated run.</div></section>';return[]}
  $('#meta').textContent='Updated '+fmtDate(P.generated_at);
  const a=P.account,c=P.cfg,open=P.open,done=P.settled,S=stat(done);
  const out=[];const add=(id,label,html)=>out.push({id,label,html});

  add('account','Account',`<h2>Account</h2><div class="grid">
    <div class="card"><div class="k">Equity</div><div class="v">${E(a.equity)}</div><div class="n">cash ${E(a.cash)} · at stake ${E(a.pending)}<br>net result <b class="${a.net_pnl>=0?'pos':'neg'}">${sg(a.net_pnl)}</b> · deposited ${E(a.deposits)}</div></div>
    <div class="card"><div class="k">API credits this month</div><div class="v">${P.credits.used}<span class="muted" style="font-size:18px"> / ${P.credits.cap}</span></div><div class="n">Fetching one league's odds costs credits. Empty runs cost nothing.</div></div></div>`);

  add('performance','Performance',`<h2>Live performance</h2>
    <div class="grid">
    <div class="card"><div class="k">Settled bets</div><div class="v">${S.n}</div><div class="n">${open.length} open · hit rate ${S.hit==null?'–':pct(S.hit)}</div></div>
    <div class="card"><div class="k">Actual profit</div><div class="v ${S.pnl>=0?'pos':'neg'}">${sg(S.pnl)}</div><div class="n">turnover ${E(S.turn)} · ROI ${S.roi==null?'–':sgn(S.roi)}</div></div>
    <div class="card"><div class="k">Expected profit (EV)</div><div class="v">${sg(S.exp)}</div><div class="n">${S.n?`typical spread ±€${S.sd.toFixed(2)}`+(S.z==null?'':` · ${S.z.toFixed(1)}σ from EV`):'no settled bets yet'}</div></div></div>
    <p class="note">With few bets the result is mostly luck. If the spread is larger than the EV, nothing can be concluded yet. The method is judged only after hundreds of bets.</p>`
    +(()=>{const s=done.filter(b=>b.status!='void').slice().sort((x,y)=>(x.settled_at||'').localeCompare(y.settled_at||''));let cum=0;
      const rows=s.map(b=>{cum+=b.pnl;return{t:(b.settled_at||'').slice(5,10),v:cum}});
      return rows.length>1?`<div style="margin-top:18px"><div class="k" style="margin-bottom:8px">Cumulative profit</div>${lineChart(rows,v=>Math.round(v)+' €')}</div>`:''})());

  const per=GROUPS.map(g=>({g,...stat(done.filter(b=>grp(b.sport)==g)),open:open.filter(b=>grp(b.sport)==g).length})).filter(r=>r.n||r.open);
  if(per.length)add('sports','Sports',`<h2>Sports compared</h2><p class="lede">Each sport is a separate experiment. Compare actual profit with the expected value.</p><div class="scroll"><table><thead><tr><th>Sport</th><th class="num">Settled</th><th class="num">Open</th><th class="num">Turnover</th><th class="num">Profit</th><th class="num">ROI</th><th class="num">EV</th><th class="num">vs EV</th></tr></thead><tbody>${per.map(r=>`<tr><td>${r.g}</td><td class="num">${r.n}</td><td class="num">${r.open}</td><td class="num">${E(r.turn)}</td><td class="num ${r.pnl>=0?'pos':'neg'}">${sg(r.pnl)}</td><td class="num">${r.roi==null?'–':sgn(r.roi)}</td><td class="num">${sg(r.exp)}</td><td class="num">${r.z==null?'–':r.z.toFixed(1)+'σ'}</td></tr>`).join('')}</tbody></table></div>`);

  const head=l=>`<thead><tr><th>Start</th><th>Sport</th><th>Match</th><th>Pick</th><th>Bookmaker</th><th class="num">Odds</th><th class="num">Fair</th><th class="num">Edge</th><th class="num">Stake</th><th class="num">To win</th><th class="num">${l}</th></tr></thead>`;
  const row=b=>`<tr><td>${fmtDate(b.commence)}</td><td class="muted">${grp(b.sport)}</td><td><b>${esc(b.home)}</b> – ${esc(b.away)}</td><td>${esc(b.selection)}</td><td>${esc(b.book_title||b.book)}</td><td class="num">${b.odds.toFixed(2)}</td><td class="num">${pct(b.p_ref)}</td><td class="num">${sgn(b.edge)}</td><td class="num">€${b.stake.toFixed(2)}</td><td class="num" title="Total payout incl. stake: €${(b.stake*b.odds).toFixed(2)}">+€${(b.stake*(b.odds-1)).toFixed(2)}</td>`;
  const fairP=b=>(1+b.edge)/b.odds;
  const minOdds=b=>(1+c.min_edge_pinnacle)/fairP(b), beOdds=b=>1/fairP(b);
  add('open','Open bets',`<h2>Open bets</h2><p class="lede">Odds move. <b>Min odds</b> is the lowest price at which the bet still meets our ${pct(c.min_edge_pinnacle)} edge threshold. <b>Break-even</b> is where the edge hits zero. If the bookmaker now offers less than Min odds, skip the bet.</p>`+(open.length?`<div class="scroll"><table>${head('EV').replace('<th class="num">EV</th>','<th class="num">Min odds</th><th class="num">Break-even</th><th class="num">EV</th>')}<tbody>${open.map(b=>row(b)+`<td class="num"><b>${minOdds(b).toFixed(2)}</b></td><td class="num muted">${beOdds(b).toFixed(2)}</td><td class="num">€${b.ev.toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No open bets.</div>'));
  add('settled','Settled',`<h2>Settled bets</h2>`+(done.length?`<div class="scroll tall"><table>${head('Result')}<tbody>${done.map(b=>row(b)+`<td class="num"><span class="pill ${b.status=='won'?'ok':b.status=='lost'?'bad':''}">${b.status=='void'?'void':(b.pnl>=0?'+':'−')+'€'+Math.abs(b.pnl).toFixed(2)}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nothing settled yet.</div>'));

  const calE=(P.calendar&&P.calendar.events)||[];
  const ST={planned:'planned',checked:'odds checked, no bet',bet:'bet placed'};
  if(calE.length)add('calendar','Calendar',`<h2>Calendar, next 7 days</h2><p class="lede">The fixture list refreshes every run (free, no credits). Odds are fetched only on match day, up to ${c.lookahead_hours} hours before kick-off. Refreshed ${fmtDate(P.calendar.updated_at)}.</p><div class="scroll"><table><thead><tr><th>Start</th><th>Sport / league</th><th>Match</th><th>Status</th></tr></thead><tbody>${calE.map(e=>`<tr><td>${fmtDate(e.commence)}</td><td class="muted">${esc(e.sport)}</td><td><b>${esc(e.home)}</b> – ${esc(e.away)}</td><td><span class="pill ${e.status=='bet'?'ok':''}">${ST[e.status]||e.status}</span></td></tr>`).join('')}</tbody></table></div>`);

  if(P.sports)add('leagues','Leagues',`<h2>Monitored leagues</h2><p class="lede">Market: match winner (1X2 in football, moneyline elsewhere). Over/under and other markets are not played. Checked ${fmtDate(P.sports.updated_at)}.</p><div class="box"><b>Active in the API:</b> ${P.sports.resolved.length?P.sports.resolved.map(esc).join(', '):'–'}<br><b>Missing or out of season:</b> ${P.sports.missing.length?P.sports.missing.map(esc).join(', '):'–'}${P.sports.other_active&&P.sports.other_active.length?`<br><b>Other active leagues (can be added to the config):</b> <span class="muted">${P.sports.other_active.map(esc).join(', ')}</span>`:''}</div>`);

  const lr=P.runs&&P.runs.length?P.runs[P.runs.length-1]:null;
  if(lr&&lr.diag&&lr.diag.length)add('last-run','Last run',`<h2>Last run: why no bet</h2><p class="lede">${fmtDate(lr.t)} · odds requests ${lr.polled} · events ${lr.events} · new bets ${lr.new_bets} · API credits left ${lr.remaining==null?'–':lr.remaining}</p><div class="scroll tall"><table><thead><tr><th>Sport</th><th>Match</th><th class="num">Bookmakers</th><th>Pinnacle</th><th class="num">Best edge</th><th>Reason</th></tr></thead><tbody>${lr.diag.map(d=>`<tr><td class="muted">${esc(d.sport)}</td><td>${esc(d.event)}</td><td class="num">${d.n_books}</td><td>${d.has_ref?'yes':'no'}</td><td class="num">${d.best_edge==null?'–':sgn(d.best_edge)}</td><td class="muted">${esc(d.why||'')}</td></tr>`).join('')}</tbody></table></div>`);

  add('rules','Rules',`<h2>Staking rules</h2><div class="box"><ul>
    <li><b>Edge (EV per €1)</b> = odds × fair probability − 1. We bet only when the edge is at least ${pct(c.min_edge_pinnacle)} against Pinnacle (or ${pct(c.min_edge_consensus)} against the market median) and at most ${pct(c.max_edge)}; anything larger is usually an error or a stale line.</li>
    <li><b>Fair probability</b> comes from Pinnacle's odds with the margin removed.</li>
    <li><b>Stake</b> = ${pct(c.kelly_fraction)} Kelly, capped at <b>${pct(c.max_stake_pct)} of bankroll per bet</b>.</li>
    <li><b>Portfolio caps:</b> new stakes ≤ ${pct(c.max_daily_exposure_pct)} of bankroll per day, all open bets ≤ ${pct(c.max_open_exposure_pct)}. The bot never stakes more than its cash.</li>
    <li><b>Bookmakers we bet at</b> (available in Ireland): ${(c.bookmakers||[]).filter(x=>x!=c.reference_book).map(x=>esc((P.books_seen&&P.books_seen[x])||x)).join(', ')||'all in region '+c.regions}. Reference price: ${esc((P.books_seen&&P.books_seen[c.reference_book])||c.reference_book)} (not bet at).</li>
    <li><b>Settlement:</b> football results come free from football-data.co.uk and tennis results from tennis-data.co.uk; The Odds API scores are a paid fallback used only when bets are open. No bets are placed on tennis tournaments that cannot be settled.</li>
    </ul><p class="note" style="margin:10px 0 0">Top up or reset the account: GitHub → Actions → <b>paper-admin</b> → Run workflow (deposit / withdraw / reset / set).</p></div>`);
  return out;
}
const secs=build();
$('#view').innerHTML=secs.map(s=>`<section id="${s.id}">${s.html}</section>`).join('')||$('#view').innerHTML;
$('#links').innerHTML=secs.map(s=>`<a href="#${s.id}" data-id="${s.id}">${s.label}</a>`).join('');
const links=[...document.querySelectorAll('#links a')];
let lock=0;
links.forEach(a=>a.addEventListener('click',()=>{lock=Date.now()+1000;links.forEach(x=>x.classList.toggle('on',x===a))}));
function spy(){
  if(Date.now()<lock)return;
  let cur=null;const y=window.scrollY+window.innerHeight*0.45;
  secs.forEach(s=>{const el=document.getElementById(s.id);if(el&&el.offsetTop<=y)cur=s.id});
  if(window.innerHeight+window.scrollY>=document.body.scrollHeight-4&&secs.length)cur=secs[secs.length-1].id;
  links.forEach(a=>a.classList.toggle('on',a.dataset.id===cur));
  const on=document.querySelector('#links a.on');if(on)on.scrollIntoView({block:'nearest',inline:'center'});
}
addEventListener('scroll',spy,{passive:true});spy();
</script>
</body>
</html>
