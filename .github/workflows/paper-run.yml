name: paper-run
# Co godzine 07:07-20:07 UTC (ok. 08-22 czasu polskiego). GitHub potrafi opoznic zaplanowane przebiegi, dlatego automat
# patrzy na mecze z wyprzedzeniem (lookahead_hours w paper/config.json) i kazdy mecz obsluguje tylko raz.
# UWAGA: zaplanowane uruchomienia dzialaja tylko z galezi domyslnej (po scaleniu PR).
on:
  schedule:
    - cron: "7 7-20 * * *"
  workflow_dispatch:
concurrency:
  group: paper
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Przebieg automatu
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m xg.paper run
      - name: Zapis stanu do repo
        run: |
          git config user.name "xg-bot"
          git config user.email "xg-bot@users.noreply.github.com"
          git add paper web/paper.js
          if git diff --cached --quiet; then echo "Brak zmian"; exit 0; fi
          git commit -m "paper: przebieg $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break || sleep 5; done
